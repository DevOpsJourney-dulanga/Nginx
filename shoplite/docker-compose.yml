services:
  api1:
    build: ./backend
    environment: { INSTANCE_NAME: api1, PORT: 5000 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api2:
    build: ./backend
    environment: { INSTANCE_NAME: api2, PORT: 5000 }
    restart: unless-stopped

  api3:
    build: ./backend
    environment: { INSTANCE_NAME: api3, PORT: 5000 }
    restart: unless-stopped

  nginx:
    build: ./frontend               # React build + nginx image
    ports:
      - "8081:80"                   # http://localhost:8080 open කරන්න
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2, api3]