worker_processes auto;

events {
    worker_connections 1024;                #maximum number of connections
}

http {
    include   /etc/nginx/mime.types;  #include the mime types
    default_type  application/octet-stream; #default type

    #Custom log format

    log_format upstreamlog  '$remote_addr "request" status =$status'
                            'upstream=$upstream_addr '
                            'upstream_status=$upstream_status '
                            'req_time=$request_time '
                            'upstream_time=$upstream_response_time ';
    access_log /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log warn;

    upstream api_servers {
        #least_conn;    # Experiment B
        # ip_hash;       # Experiment C

        server api1:5000 max_fails=3 fail_timeout=15s;
        server api2:5000 max_fails=3 fail_timeout=15s;
        server api3:5000 max_fails=3 fail_timeout=15s;
        # server api3:5000 backup;   # Experiment D: අනිත් ඒවා down නම් පමණයි

        keepalive 32;    # Node වලට TCP connections නැවත පාවිච්චි (වේගවත්)
        zone api_servers 64k;

    }
    # Rate limit: client IP එකකට තත්පරයට requests 10, IPs සඳහා memory 10 MB
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Disk එකේ store වෙන response cache
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;


    # WebSocket helper: client upgrade කරන්න හදනවා නම් පමණක් Connection header set කරනවා
    map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
    }

    server {
        listen 80;
        server_name  localhost;
        
        # react static files
        root /usr/share/nginx/html;
        index index.html;

        location /{
            try_files $uri /index.html;
        }
        location /api/ {
            proxy_pass http://api_servers;

            proxy_http_version 1.1;
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            proxy_set_header Connection "";   # upstream keepalive වලට අතාවශ්‍යයි

            # Backend එකක් fail වුණොත්, request එක ඊළඟ එකට නැවත යවනවා
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
        }
            client_max_body_size 5m;                       # upload උපරිම size (ඊට වඩා නම් 413)
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;

            # Vite hashed files /assets/ එකේ දානවා: අවුරුද්දක් cache කරන්න පුළුවන්
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

            # Product list එක තත්පර 30කට cache (read-heavy, වෙනස් වෙන්නේ අඩුවෙන්)
        location = /api/products {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_cache api_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;


            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

